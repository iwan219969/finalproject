<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CINÉMA / Sign up</title>
  <link rel="stylesheet" href="signup.css">
</head>
<body>
  <main class="signup-shell">
    <a class="brand" href="index.html"><span class="brand-mark">✦</span> CINÉMA</a>
    <section class="signup-card">
      <p class="eyebrow">WELCOME TO THE CLUB</p>
      <h1>Make movie<br><em>nights yours.</em></h1>
      <p class="intro">Create an account to keep your tickets and discover new screenings.</p>
      <form id="signupForm">
        <label>Full name<input id="name" required type="text" placeholder="Alex Morgan"></label>
        <label>Email address<input id="email" required type="email" placeholder="alex@example.com"></label>
        <label>Password<input id="password" required minlength="6" type="password" placeholder="At least 6 characters"></label>
        <button class="primary" type="submit">Create account <span>→</span></button>
      </form>
      <p class="form-message" id="message"></p>
      <a class="back" href="index.html">← Back to movies</a>
    </section>
  </main>
  <script src="signup.js"></script>
</body>
</html>
